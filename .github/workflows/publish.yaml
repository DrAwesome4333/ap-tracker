# File: .github/workflows/publish.yml
name: publish-to-github-pages
on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+" # Matches v1.0.0, v2.1.5, etc.
            - "v[0-9]+.[0-9]+.[0-9]+-test.[0-9]+" # for forced test versions.

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: true

            - name: Set environment variables based on tags
              run: |
                touch .env.production.local;
                if [[ "${{ github.ref_name }}" == *"-test"* ]]; then
                  echo "NEXT_PUBLIC_ENVIRONMENT_NAME=\"test\"" >> .env.production.local
                fi


            - name: Setup Node.js - Cache dependencies - Install dependencies
              uses: ./.github/workflows/setup-node

            - uses: oven-sh/setup-bun@v1
            - name: Build archipelago.js
              run: |
                  cd external/archipelago.js
                  npm i
                  npm run build

            - name: Setup Pages
              uses: actions/configure-pages@v4
              with:
                  static_site_generator: next

            - name: Build with Next.js
              run: npx next build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./build

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Publish to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
